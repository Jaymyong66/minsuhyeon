<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>민수 ❤ 수현 결혼합니다.</title>

    <!--
      Pretendard 한 벌로 통일한다. 그동안 CSS 에 이름만 적혀 있고 실제로 불러오지는
      않아서, 아이폰은 SF Pro, 안드로이드는 또 다른 폰트로 제각각 보이고 있었다.
      dynamic-subset 은 쓰이는 글자만 내려받아 한글이어도 가볍다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <!-- 카카오톡 등 링크 공유 시 미리보기(Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="민수 ❤ 수현 결혼합니다." />
    <meta property="og:description" content="소중한 날, 소중한 당신을 초대합니다." />
    <!--
      파일 이름에 번호를 붙여 갈아끼운다. 같은 이름으로 덮으면 카카오가 예전 썸네일을
      계속 보여준다. 사진은 잘리지 않도록 1200x630 안에 통째로 넣고 남는 양옆을 배경색으로 채웠다.
    -->
    <meta property="og:image" content="https://wedding.minsuhyeon.life/og-image-2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://wedding.minsuhyeon.life" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
