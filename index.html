<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>민수 ❤ 수현 결혼합니다.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet" />

    <!-- 카카오톡 등 링크 공유 시 미리보기(Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="민수 ❤ 수현 결혼합니다." />
    <meta property="og:description" content="소중한 날, 소중한 당신을 초대합니다." />
    <!--
      파일 이름에 번호를 붙여 갈아끼운다. 같은 이름으로 덮으면 카카오가 예전 썸네일을
      계속 보여준다. 사진은 잘리지 않도록 1200x630 안에 통째로 넣고 남는 양옆을 배경색으로 채웠다.
    -->
    <meta property="og:image" content="https://wedding.minsuhyeon.life/og-image-2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://wedding.minsuhyeon.life" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
