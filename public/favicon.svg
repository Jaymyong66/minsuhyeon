<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    탭 아이콘. 16px 로 줄어들어도 알아볼 수 있게 장식 없이 하트 하나만 둔다.
    색은 테마의 accentStrong(#b05a72). 밝은 accent(#f2b8c6)는 흰 탭 배경에
    묻혀서 안 보인다. 어두운 탭에서는 조금 밝은 핑크로 바꾼다.
  -->
  <style>
    .heart { fill: #b05a72 }
    @media (prefers-color-scheme: dark) {
      .heart { fill: #f2b8c6 }
    }
  </style>
  <path class="heart" d="M16 28C16 28 3 20 3 11.5C3 7 6.6 3.5 11 3.5C13.6 3.5 15.2 5 16 6.2C16.8 5 18.4 3.5 21 3.5C25.4 3.5 29 7 29 11.5C29 20 16 28 16 28Z"/>
</svg>
